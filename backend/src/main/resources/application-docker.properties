spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:duolingo}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:duolingo}
spring.datasource.password=${POSTGRES_PASSWORD:duolingo_dev_password}
spring.datasource.hikari.initialization-fail-timeout=30000
app.storage.profile-pictures=${PROFILE_PICTURE_STORAGE_PATH:/app/uploads/profile-pictures}
app.logging.dir=${LOG_DIR:/app/logs}
app.logging.retention-days=${LOG_RETENTION_DAYS:30}

spring.docker.compose.enabled=false

server.port=8080

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Spring Boot Actuator & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name:proj}
