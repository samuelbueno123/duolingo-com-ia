spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:duolingo}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:duolingo}
spring.datasource.password=${POSTGRES_PASSWORD:duolingo_dev_password}
spring.datasource.hikari.initialization-fail-timeout=30000
app.storage.profile-pictures=${PROFILE_PICTURE_STORAGE_PATH:/app/uploads/profile-pictures}

spring.docker.compose.enabled=false

server.port=8080

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
