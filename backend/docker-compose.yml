services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-367385027390-dmuj8neeqpgcbph3uk9qfb2cs5ubldhp.apps.googleusercontent.com}
      CORS_ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - duolingo-data:/app/data
    restart: unless-stopped

volumes:
  duolingo-data: