services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duolingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duolingo_dev_password}
      POSTGRES_USER: ${POSTGRES_USER:-duolingo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duolingo} -d ${POSTGRES_DB:-duolingo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-duolingo-ia-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - profile-pictures:/app/uploads/profile-pictures
    env_file:
      - .env.local
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-duolingo}
      POSTGRES_USER: ${POSTGRES_USER:-duolingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duolingo_dev_password}
      PROFILE_PICTURE_STORAGE_PATH: /app/uploads/profile-pictures
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  profile-pictures:
