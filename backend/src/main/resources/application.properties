# Sem aspas: o valor precisa corresponder exatamente ao campo "aud" do ID token.
google.client-id=367385027390-dmuj8neeqpgcbph3uk9qfb2cs5ubldhp.apps.googleusercontent.com


# ==================================================
# JPA
# ==================================================

spring.jpa.hibernate.ddl-auto=update

