# Configuração de Produção (perfil: prod / production)
# Nenhum segredo padrão é definido aqui. O ProductionSecurityValidator falhará
# na inicialização se JWT_SECRET, POSTGRES_PASSWORD, APP_ADMIN_EMAILS ou
# APP_ADMIN_INITIAL_PASSWORD não forem informados com valores seguros.

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:duolingo}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=30000

jwt.secret=${JWT_SECRET:}
google.client-id=${GOOGLE_CLIENT_ID:}
app.admin-emails=${APP_ADMIN_EMAILS:}
app.admin.initial-password=${APP_ADMIN_INITIAL_PASSWORD:}

app.ai.api-key=${AI_API_KEY:}
app.ai.provider-url=${AI_PROVIDER_URL:https://generativelanguage.googleapis.com/v1beta/models}
app.ai.model=${AI_MODEL:gemini-2.5-flash}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
