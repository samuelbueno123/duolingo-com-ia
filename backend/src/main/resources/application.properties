spring.application.name=proj

server.port=${SERVER_PORT:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

google.client-id=${GOOGLE_CLIENT_ID:367385027390-dmuj8neeqpgcbph3uk9qfb2cs5ubldhp.apps.googleusercontent.com}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:h2:file:${H2_DB_PATH:./data/duolingo};AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.docker.compose.enabled=false

CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5501,http://localhost:5501,http://127.0.0.1:5500,http://localhost:5500}