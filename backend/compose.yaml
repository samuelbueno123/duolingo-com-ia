services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duolingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duolingo_dev_password}
      POSTGRES_USER: ${POSTGRES_USER:-duolingo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duolingo} -d ${POSTGRES_DB:-duolingo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data: