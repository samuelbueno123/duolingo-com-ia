spring.application.name=proj
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties],optional:file:backend/.env[.properties],optional:file:backend/.env.local[.properties],optional:file:../.env[.properties],optional:file:../.env.local[.properties]

server.port=${SERVER_PORT:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

google.client-id=${GOOGLE_CLIENT_ID:}
jwt.secret=${JWT_SECRET:Qa_nMLnp6cCiMSew10ZOceKwt3UQZvfUbG25IL1jIybAuVUiFr-59qYXYBBBQjhf}
app.admin-emails=${APP_ADMIN_EMAILS:admin@duolingo.com}
app.admin.initial-password=${APP_ADMIN_INITIAL_PASSWORD:}
app.storage.profile-pictures=${PROFILE_PICTURE_STORAGE_PATH:./uploads/profile-pictures}

