services:
  postgres:
    image: postgres:17-alpine
    container_name: duolinfo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duolingo}
      POSTGRES_USER: ${POSTGRES_USER:-duolingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duolingo_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - duolinfo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duolingo} -d ${POSTGRES_DB:-duolingo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-duolingo-ia-backend:latest}
    container_name: duolinfo-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - profile-pictures:/app/uploads/profile-pictures
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.local
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_must_be_changed_in_prod_at_least_32_bytes_long}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-admin@duolingo.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000,http://localhost:5500,http://localhost:8081}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-duolingo}
      POSTGRES_USER: ${POSTGRES_USER:-duolingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duolingo_dev_password}
      PROFILE_PICTURE_STORAGE_PATH: /app/uploads/profile-pictures
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-false}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-false}
      SPRING_MAIL_STARTTLS_REQUIRED: ${SPRING_MAIL_STARTTLS_REQUIRED:-false}
      SPRING_MAIL_SSL_TRUST: ${SPRING_MAIL_SSL_TRUST:-*}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@duolinfo.local}
      FRONTEND_PROTOCOL: ${FRONTEND_PROTOCOL:-http}
      FRONTEND_HOST: ${FRONTEND_HOST:-localhost}
      FRONTEND_PORT: ${FRONTEND_PORT:-5500}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5500}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-https://generativelanguage.googleapis.com/v1beta/models}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
    networks:
      - duolinfo-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${FRONTEND_IMAGE:-duolinfo-frontend:latest}
    container_name: duolinfo-frontend
    build:
      context: ./sprint-java-frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
        GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-367385027390-dmuj8neeqpgcbph3uk9qfb2cs5ubldhp.apps.googleusercontent.com}
        GOOGLE_SERVER_CLIENT_ID: ${GOOGLE_SERVER_CLIENT_ID:-367385027390-dmuj8neeqpgcbph3uk9qfb2cs5ubldhp.apps.googleusercontent.com}
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    networks:
      - duolinfo-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: duolinfo-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - duolinfo-network
    restart: unless-stopped

networks:
  duolinfo-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  profile-pictures:
    driver: local
