spring.application.name=proj
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

server.port=${SERVER_PORT:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

google.client-id=${GOOGLE_CLIENT_ID:}
jwt.secret=${JWT_SECRET:Qa_nMLnp6cCiMSew10ZOceKwt3UQZvfUbG25IL1jIybAuVUiFr-59qYXYBBBQjhf}
app.admin-emails=${APP_ADMIN_EMAILS:admin@duolingo.com}
app.admin.initial-password=${APP_ADMIN_INITIAL_PASSWORD:}
app.storage.profile-pictures=${PROFILE_PICTURE_STORAGE_PATH:./uploads/profile-pictures}

app.ai.api-key=${AI_API_KEY:}
app.ai.provider-url=${AI_PROVIDER_URL:https://generativelanguage.googleapis.com/v1beta/models}
app.ai.model=${AI_MODEL:gemini-2.5-flash}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:duolingo}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:duolingo}
spring.datasource.password=${POSTGRES_PASSWORD:duolingo_dev_password}
spring.datasource.hikari.initialization-fail-timeout=30000

spring.docker.compose.enabled=false
